[project]
name = "teams-mcp-server"
version = "0.3.0"
description = "MCP server for Microsoft Teams via Graph API"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=2.3.0,<3",
    "msal>=1.39.0",
    "httpx>=0.28.1",
    # msal's HTTP client; auth.py catches its network exceptions
    "requests>=2.34.2,<3",
]

[project.scripts]
teams-mcp = "teams_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teams_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
