[project]
name = "teams-mcp-server"
version = "0.2.1"
description = "MCP server for Microsoft Teams via Graph API"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0",
    "msal>=1.31.0",
    "httpx>=0.28.0",
]

[project.scripts]
teams-mcp = "teams_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teams_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
